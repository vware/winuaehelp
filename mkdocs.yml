          - ROM: gui/rom.md
          - RAM: gui/ram.md
          - Floppy Drives: gui/floppies.md
          - "CD & Hard Drives": gui/harddrives.md
          - Expansions: gui/expansions.md
          - RTG board: gui/rtgboard.md
          - Hardware info: gui/hardwareinfo.md
      - Host:
          - Overview: gui/host.md
          - Display: gui/display.md
          - Sound: gui/sound.md
          - Game ports: gui/gameports.md
          - IO ports: gui/ports.md
          - Input: gui/input.md
          - Output: gui/output.md
          - Filter: gui/filter.md
