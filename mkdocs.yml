site_name: WinUAE Help 4.0
site_url: https://winuaehelp.vware.at/
site_description: Official help for WinUAE, the Amiga emulator for Windows
copyright: Help content is released under the terms of the GNU Free Documentation License.

use_directory_urls: false

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - to-pdf:
      output_path: winuaehelp.pdf
      cover_subtitle: Official help for WinUAE, the Amiga emulator for Windows
      cover_logo: logo.png
      toc_level: 3

markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - "Welcome!": index.md
  - Features: features.md
  - Bugs: bugs.md
  - Links: links.md
  - Glossary: glossary.md
  - FAQ: faq.md
  - Getting Started:
      - started/index.md
      - Requirements: started/require.md
      - Info For First Time Users: started/firsttimeuser.md
      - Example Configurations: started/examples.md
  - The GUI:
      - gui/index.md
      - Paths: gui/paths.md
      - Quickstart: gui/quickstart.md
      - Configurations: gui/configurations.md
      - Hardware:
